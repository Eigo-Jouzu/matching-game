<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matching Game</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/qrcode.min.js" defer></script>
    <script src="assets/main.js" defer></script>
  </head>
  <body>
    <section class="screen start-screen">
      <h1 class="title">Loading…</h1>
      <div class="qr-code"></div>
      <p class="caption">Scan to play! QRコードをよみとってね</p>
      <button class="big-button play-button" disabled>Play ▶</button>
    </section>

    <section class="screen game-screen" hidden>
      <div class="hud">
        <div class="round-box">
          Round <span class="round">1</span> /
          <span class="total-rounds"></span>
        </div>
        <div class="score-box">⭐ <span class="score">0</span></div>
      </div>
      <main class="board"></main>
      <button class="big-button next-round" hidden>Next round ▶</button>
    </section>

    <section class="screen end-screen" hidden>
      <h2 class="end-message"></h2>
      <p class="final-score"></p>
      <button class="big-button play-again">Play again ↻</button>
    </section>

    <div class="feedback" aria-hidden="true">
      <div class="mark"><span class="points"></span></div>
    </div>
  </body>
</html>
